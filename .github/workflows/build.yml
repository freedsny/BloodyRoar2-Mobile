name: Construir Bloody Roar 2 Mobile

# Toma el APK v1.0 oficial de nevertheaxolot, le aplica el icono y el nombre
# de este repo, lo firma con tu llave y lo publica.
#   - Cada cambio en "main" deja el APK como artefacto descargable (pestaña Actions).
#   - También se publica como Release: en main con el nombre de la versión del
#     APK (ej. v1.0-mobile.2), o con la etiqueta v* que crees.
#
# Secretos necesarios (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64    la llave br2mobile.jks convertida a base64
#   KEYSTORE_PASSWORD  la contraseña de esa llave
# Sin ellos el proceso falla y no publica nada (antes se firmaba con la llave
# de depuración pública, y los antivirus marcaban la app como virus).

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch: {}

permissions:
  contents: write

env:
  UPSTREAM_APK_URL: https://github.com/nevertheaxolot/BloodyRoar2mobileRecomp/releases/download/Official-launch/app-debug.apk
  UPSTREAM_APK_SHA256: 69f4840cfad26dd9d4e99fece0a77db12cc1daa1c893cede764b3920f6152659
  APKTOOL_URL: https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar
  SIGNER_URL: https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar herramientas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          mkdir -p tools
          curl -sSL -o tools/apktool.jar "$APKTOOL_URL"
          curl -sSL -o tools/signer.jar "$SIGNER_URL"

      - name: Descargar y verificar el APK v1.0 original
        run: |
          curl -sSL -o original.apk "$UPSTREAM_APK_URL"
          echo "$UPSTREAM_APK_SHA256  original.apk" | sha256sum -c -

      - name: Descompilar
        run: |
          python3 icon/make_icon.py icon/svg
          java -jar tools/apktool.jar d -f -o dec original.apk

      - name: Compilar trucos (plugin nativo + menú)
        run: |
          ANDROID_JAR=$(ls -d "$ANDROID_HOME"/platforms/android-*/android.jar | sort -V | tail -n1)
          D8=$(ls -d "$ANDROID_HOME"/build-tools/*/d8 | sort -V | tail -n1)
          echo "android.jar: $ANDROID_JAR"; echo "d8: $D8"; clang --version | head -n1
          bash patch/build_extras.sh extras dec/lib/arm64-v8a/libpsx_android.so "$ANDROID_JAR" "$D8"

      - name: Aplicar parche y reconstruir
        run: |
          bash patch/apply_patch.sh dec icon/svg extras
          java -jar tools/apktool.jar b dec -o unsigned.apk
          # El menú de trucos va como el siguiente classesN.dex del APK
          N=$(( $(unzip -Z1 unsigned.apk | grep -cE '^classes[0-9]*\.dex$') + 1 ))
          cp extras/classes.dex "extras/classes$N.dex"
          (cd extras && zip -q ../unsigned.apk "classes$N.dex")
          unzip -Z1 unsigned.apk | grep -E '^classes|libbr2cheats'

      - name: Firmar
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > br2mobile.jks
            java -jar tools/signer.jar -a unsigned.apk -o signed \
              --ks br2mobile.jks --ksAlias br2mobile \
              --ksPass "$KEYSTORE_PASSWORD" --ksKeyPass "$KEYSTORE_PASSWORD"
            rm -f br2mobile.jks
          else
            # La llave de depuración pública hace que los antivirus marquen la
            # app como virus y no deja instalar encima: mejor no publicar nada.
            echo "::error::Falta el secreto KEYSTORE_BASE64 (tu llave br2mobile.jks). No se publica un APK con la llave pública."
            exit 1
          fi
          VERSION=$(grep versionName dec/apktool.yml | awk '{print $2}')
          mv signed/*.apk "BloodyRoar2Mobile-v${VERSION}.apk"
          sha256sum BloodyRoar2Mobile-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BloodyRoar2Mobile
          path: BloodyRoar2Mobile-*.apk

      - name: Publicar Release
        # Con etiqueta v* usa esa etiqueta. En main usa la versión del APK
        # (versionName de patch/apply_patch.sh, ej. v1.0-mobile.2): la crea si
        # no existe o le reemplaza el APK si ya existe.
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$(grep versionName dec/apktool.yml | awk '{print $2}')"
          fi
          NOTES="APK con icono y nombre propios, controles estilo PlayStation, botones GUARDAR, CARGAR y MENÚ, pantalla ancha, turbo, saltar intro y menú de Trucos, basado en la v1.0 de nevertheaxolot. No incluye el juego: necesitas tu propia imagen de Bloody Roar II (USA) y el OpenBIOS."
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "La Release $TAG ya existe: se reemplaza el APK"
            gh release upload "$TAG" BloodyRoar2Mobile-*.apk --clobber
          else
            gh release create "$TAG" BloodyRoar2Mobile-*.apk --target "$GITHUB_SHA" \
              --title "Bloody Roar 2 Mobile $TAG" --notes "$NOTES"
          fi
