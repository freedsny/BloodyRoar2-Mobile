# Paquete de mods "Trucos" de Bloody Roar 2 Mobile.
# Lo instala la app en files/mods/bundled/ y el menú "Trucos" escribe
# files/mods/state.toml con los que estén activos. Cada [[plugin]] lo
# implementa libbr2cheats.so (patch/cheats/br2cheats.c).
# Las "Mejoras" vienen de los mods oficiales de NovaPowers (widescreen,
# turbo, intro skip) del proyecto de PC.
format_version = 5
id = "br2mobile.cheats"
version = "1.0.0"
name = "Bloody Roar 2 Mobile - Trucos"
author = "Freed"
description = "Trucos GameShark de Bloody Roar II (USA) y mejoras: pantalla ancha, turbo y saltar la intro."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SCUS-94424"

[[feature]]
id = "personajes"
name = "Todos los personajes"
description = "Desbloquea a Gado y Shen Long."
group = "Desbloqueos"
default_enabled = false

[[plugin]]
feature = "personajes"
id = "br2mobile.cheats.personajes"

[[feature]]
id = "custom"
name = "Todo el modo Custom"
description = "Desbloquea todas las opciones Custom."
group = "Desbloqueos"
default_enabled = false

[[plugin]]
feature = "custom"
id = "br2mobile.cheats.custom"

